<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>元素○×チャレンジ</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">

    <h1>元素○×チャレンジ（1〜20）</h1>

    <div class="top-bar">
        <div>スコア：<span id="score">0</span></div>
        <div>問題：<span id="count">1</span>/20</div>
    </div>

    <div class="question-title">この元素記号は正しい？</div>

    <div class="question">
        <div class="bigText" id="symbol">H</div>
        <div id="name">水素</div>
    </div>

    <div class="buttonArea">
        <button id="trueBtn" onclick="answer(true)">○ 正しい</button>
        <button id="falseBtn" onclick="answer(false)">× 不正解</button>
    </div>

    <div id="message"></div>

    <div class="footer">元素1〜20を覚えよう！</div>

</div>

<script src="script.js"></script>
</body>
</html>
